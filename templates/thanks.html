<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziękujemy | NEROX STUDIO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --tiffany-main: #0ABAB5;
            --tiffany-light: #2ef0e6;
            --tiffany-glow: rgba(10, 186, 181, 0.25);
            --bg-dark: #05080a;
            --bg-card: rgba(13, 20, 24, 0.75);
            --border-neon: rgba(10, 186, 181, 0.25);
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 30%, rgba(10, 186, 181, 0.08) 0%, transparent 60%);
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .thanks-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-neon);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(10, 186, 181, 0.1);
            position: relative;
        }

        .thanks-icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            background: rgba(10, 186, 181, 0.08);
            border: 1px solid var(--tiffany-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(10, 186, 181, 0.3);
        }

        .thanks-icon {
            font-size: 2.2rem;
            color: var(--tiffany-light);
            text-shadow: 0 0 10px rgba(10, 186, 181, 0.5);
        }

        h1 {
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.8rem;
            color: #ffffff;
        }

        h1 span {
            color: var(--tiffany-main);
            text-shadow: 0 0 15px rgba(10, 186, 181, 0.5);
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .btn-tiffany {
            background-color: var(--tiffany-main);
            color: #000000 !important;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            text-decoration: none;
            display: block;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(10, 186, 181, 0.3);
            letter-spacing: 0.5px;
            font-size: 0.9rem;
            margin-top: 25px;
        }

        .btn-tiffany:hover {
            background-color: var(--tiffany-light);
            box-shadow: 0 0 30px rgba(46, 240, 230, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="thanks-card">
        <div class="thanks-icon-wrapper">
            <i class="fa-solid fa-check thanks-icon"></i>
        </div>
        <h1 class="text-uppercase mb-2">Dziękujemy <span>!</span></h1>
        <p class="mb-2 text-white fw-semibold">Twoje zgłoszenie zostało pomyślnie przyjęte.</p>
        <p class="mb-4">Nasz menedżer skontaktuje się z Tobą w ciągu 15 minut, aby potwierdzić szczegóły.</p>
        <a href="/" class="btn-tiffany text-uppercase">
            <i class="fa-solid fa-arrow-left me-2"></i> Powrót do strony głównej
        </a>
    </div>
</body>
</html>
